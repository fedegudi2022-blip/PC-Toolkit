name: Integración (Windows)

# Comprobaciones de cada envío: es el portero. Compila el ejecutable y el instalador —para
# que un fallo de compilación (una dependencia sin declarar, un cambio que rompe el
# empaquetado) se vea en cada envío y no al publicar, con el release ya en juego— y pasa la
# suite. No firma nada: eso está en «firmar.yml», que corre cuando se pide a mano o al
# publicar una etiqueta.
#
# Tarda unos minutos más que antes, y sale barato: descubrir el fallo aquí cuesta una
# ejecución, descubrirlo al publicar cuesta un release.
#
# Las acciones van fijadas por el SHA del commit y no por la etiqueta: una etiqueta se
# puede mover a otro commit y entonces el flujo ejecutaría código que nadie revisó.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: integracion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comprobaciones:
    name: Comprobaciones automáticas
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Descargar el código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Preparar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar las dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Se compila antes de la suite, a propósito: así las comprobaciones que revisan los
      # ejecutables de `dist\` (los cuatro artefactos, los accesos directos del paquete, la
      # instalación y la desinstalación) se hacen en cada envío y no solo al publicar. La
      # firma no se toca: sin `--firmar` no hay signtool ni Azure, y la suite omite lo que
      # necesita firmas.
      - name: Compilar el ejecutable y el instalador
        shell: pwsh
        run: |
          python build_exe.py --onefile
          if ($LASTEXITCODE -ne 0) { throw "Falló la compilación de 'PC Toolkit.exe' (código $LASTEXITCODE)" }

          python build_installer.py --rebuild
          if ($LASTEXITCODE -ne 0) { throw "Falló la compilación del instalador (código $LASTEXITCODE)" }

      # Con `dist\` compilado, la suite ya no se salta lo que revisa los ejecutables. Lo que
      # sigue omitiendo es lo que necesita firmas o la entrega —`SHA256SUMS.txt` y los
      # nombres publicados, que son de otro paso—, y la guarda de recuentos lo tiene en
      # cuenta: la guía cita el del equipo completo, que es mayor.
      #
      # Los fallos se anotan con `::error` y se copian al resumen del trabajo: así se leen
      # en la página del flujo sin abrir el registro entero, que en un servidor solo se
      # puede mirar con la sesión de GitHub iniciada (y desde otro equipo, no se puede).
      - name: Comprobaciones automáticas (sin firma)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $registro = Join-Path $env:RUNNER_TEMP 'suite.log'

          # La suite se ejecuta sin búfer (`-u`): si el proceso se muere a mitad, en el registro
          # queda dicho todo lo que había contado hasta ese momento, en vez de perderse el
          # último bloque dentro del búfer del proceso.
          python -u tests/smoke_test.py 2>&1 | Tee-Object -FilePath $registro
          $codigo = $LASTEXITCODE

          # En una pasada correcta no se anota nada. La suite habla de «errores» que provoca a
          # propósito —un lanzador que falla, un registro sin errores de lectura, una firma de
          # prueba—, así que esas líneas no se toman por fallos: solo se mira el registro cuando
          # el código de salida dice que algo ha ido mal.
          if ($codigo -eq 0) { exit 0 }

          # La suite imprime el resultado de todas las comprobaciones al final, así que un cierre
          # duro a mitad —una excepción del sistema, un proceso que se va sin decir por qué—
          # deja el registro sin ningún `[FALLO]` y el trabajo falla mudo. Se buscan las líneas
          # de fallo y las excepciones; si no hay ninguna, las últimas líneas del registro, que
          # son las que dicen por dónde iba. Y siempre el cierre del recuento, que es el titular.
          $destacadas = @(
            Select-String -Path $registro -Pattern '\[FALLO\]|Traceback|Fatal' -ErrorAction SilentlyContinue |
              Select-Object -First 30 | ForEach-Object { $_.Line.Trim() } | Where-Object { $_ }
          )
          if (-not $destacadas) {
            $destacadas = @(Get-Content -LiteralPath $registro -Tail 10 -ErrorAction SilentlyContinue) |
              ForEach-Object { $_.Trim() } | Where-Object { $_ }
          }
          $cierre = @(
            Select-String -Path $registro -Pattern '^\d+/\d+ comprobaciones|^Fallos: ' -ErrorAction SilentlyContinue |
              ForEach-Object { $_.Line.Trim() }
          )
          $textos = @($cierre + $destacadas) | Select-Object -Unique | Select-Object -First 40

          if ($textos.Count -eq 0) {
            '### La suite falló sin dejar ni una línea de salida' |
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8
            Write-Host '::error title=Fallo de la suite::El registro quedó vacío: la suite no llegó a escribir nada.'
          }
          if ($textos) {
            '### Fallos de la suite' | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8
            $textos | ForEach-Object { '- ' + $_ } | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8
            foreach ($linea in $textos) {
              $texto = $linea -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
              Write-Host "::error title=Fallo de la suite::$texto"
            }
          }
          exit $codigo

      # El registro en archivo es nuevo: si algo falla, conviene poder mirarlo sin volver a
      # reproducir el fallo en local.
      - name: Copiar el registro
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path "$env:LOCALAPPDATA\PCToolkit\logs") {
            Copy-Item "$env:LOCALAPPDATA\PCToolkit\logs" -Destination "registro" -Recurse -Force
          }

      - name: Guardar el registro si algo falla
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: registro
          path: registro/**
          if-no-files-found: ignore
          retention-days: 14
