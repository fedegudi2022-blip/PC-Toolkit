name: Integración (Windows)

# Comprobaciones de cada envío: es el portero rápido. No compila ni firma nada (eso está
# en «firmar.yml», que corre cuando se pide a mano o al publicar una etiqueta), así que
# tarda poco y avisa en cuanto algo se rompe.
#
# Las acciones van fijadas por el SHA del commit y no por la etiqueta: una etiqueta se
# puede mover a otro commit y entonces el flujo ejecutaría código que nadie revisó.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: integracion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comprobaciones:
    name: Comprobaciones automáticas
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Descargar el código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Preparar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar las dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Sin `dist\` compilado se omiten las comprobaciones que revisan los ejecutables: la
      # suite lo dice en su resumen y la guarda de recuentos lo tiene en cuenta (en un
      # equipo incompleto, la guía puede citar un número mayor).
      - name: Comprobaciones automáticas (sin firma)
        run: python tests/smoke_test.py

      # El registro en archivo es nuevo: si algo falla, conviene poder mirarlo sin volver a
      # reproducir el fallo en local.
      - name: Copiar el registro
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path "$env:LOCALAPPDATA\PCToolkit\logs") {
            Copy-Item "$env:LOCALAPPDATA\PCToolkit\logs" -Destination "registro" -Recurse -Force
          }

      - name: Guardar el registro si algo falla
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: registro
          path: registro/**
          if-no-files-found: ignore
          retention-days: 14
