name: Compilar y firmar (Windows)

# Compila el programa y el instalador en un servidor de Windows y los firma con
# Azure Artifact Signing (antes Trusted Signing) mediante una identidad federada
# OIDC: no hay ningún certificado, contraseña ni clave guardados en el repositorio.
#
# Hay que preparar una sola vez (paso a paso en DOCUMENTACION.md, apartado 8.10):
#   1. Una cuenta de Artifact Signing y un perfil de certificado en Azure.
#   2. Una aplicación en Entra ID con credencial federada para este repositorio
#      (sujeto `repo:PROPIETARIO/REPO:ref:refs/heads/main`, audiencia
#      `api://AzureADTokenExchange`) y el rol «Artifact Signing Certificate Profile Signer».
#   3. Estos secretos del repositorio: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID.
#   4. Estas variables: ARTIFACT_SIGNING_ENDPOINT (por ejemplo
#      https://weu.codesigning.azure.net), ARTIFACT_SIGNING_ACCOUNT y
#      ARTIFACT_SIGNING_PROFILE.
#
# Se ejecuta a mano (Actions → Run workflow) y al publicar una etiqueta `v…`.
# Para que corra también en cada envío a `main`, añade `branches: [main]` al `push`.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # permite pedir el token OIDC de Azure

env:
  # Versiones fijadas: cuando Microsoft publique otras, se cambian aquí.
  SDK_BUILDTOOLS_VERSION: 10.0.26100.4188
  SIGNING_CLIENT_VERSION: 1.0.146
  # Los servidores de compilación no tienen pantalla: la interfaz se dibuja
  # fuera de pantalla (Qt lo admite) y las capturas de la comprobación siguen saliendo.
  QT_QPA_PLATFORM: offscreen

jobs:
  compilar-y-firmar:
    name: Compilar, firmar y publicar
    runs-on: windows-2025
    timeout-minutes: 60

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # La biblioteca de firma en la nube necesita el entorno de ejecución de .NET 8.
      - name: Preparar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Instalar las dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Comprobaciones automáticas
        run: python tests/smoke_test.py

      - name: Descargar signtool (paquete oficial de Microsoft)
        run: python firmar.py --traer-signtool --signtool-version $env:SDK_BUILDTOOLS_VERSION
        shell: pwsh

      - name: Descargar las herramientas de firma de Azure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $destino = Join-Path $env:GITHUB_WORKSPACE 'tools\bin\artifact-signing'
          New-Item -ItemType Directory -Force -Path $destino | Out-Null

          $paquete = 'microsoft.artifactsigning.client'
          $url = "https://api.nuget.org/v3-flatcontainer/$paquete/$env:SIGNING_CLIENT_VERSION/$paquete.$env:SIGNING_CLIENT_VERSION.nupkg"
          $descarga = Join-Path $env:RUNNER_TEMP 'artifact-signing-client.nupkg'
          Invoke-WebRequest -Uri $url -OutFile $descarga
          Expand-Archive -LiteralPath $descarga -DestinationPath $destino -Force

          $dlib = Join-Path $destino 'bin\x64\Azure.CodeSigning.Dlib.dll'
          if (-not (Test-Path $dlib)) {
            throw "El paquete $paquete no trae bin\x64\Azure.CodeSigning.Dlib.dll"
          }
          "ARTIFACT_SIGNING_DLIB=$dlib" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Biblioteca de firma lista: $dlib"

      - name: Iniciar sesión en Azure con identidad federada (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Preparar el archivo de metadatos de la firma
        shell: pwsh
        env:
          ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          CUENTA: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          PERFIL: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($nombre in 'ENDPOINT', 'CUENTA', 'PERFIL') {
            if (-not [Environment]::GetEnvironmentVariable($nombre)) {
              throw "Falta la variable $nombre (Settings → Secrets and variables → Actions → Variables)"
            }
          }

          $metadatos = [ordered]@{
            Endpoint               = $env:ENDPOINT
            CodeSigningAccountName = $env:CUENTA
            CertificateProfileName = $env:PERFIL
            # `azure/login` deja la sesión iniciada en Azure CLI; se conserva esa
            # credencial y se descartan las que no existen en un servidor de compilación.
            ExcludeCredentials     = @(
              'EnvironmentCredential'
              'ManagedIdentityCredential'
              'WorkloadIdentityCredential'
              'SharedTokenCacheCredential'
              'VisualStudioCredential'
              'VisualStudioCodeCredential'
              'AzurePowerShellCredential'
              'AzureDeveloperCliCredential'
              'InteractiveBrowserCredential'
            )
          }

          # Se escribe en UTF-8 sin BOM con el API de .NET: vale igual en PowerShell 7 y
          # en el 5.1, y el archivo no lleva la marca que rompería el lector de metadatos.
          $archivo = Join-Path $env:RUNNER_TEMP 'artifact-signing-metadata.json'
          $json = $metadatos | ConvertTo-Json -Depth 5
          [System.IO.File]::WriteAllText($archivo, $json, (New-Object System.Text.UTF8Encoding($false)))
          "ARTIFACT_SIGNING_METADATA=$archivo" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-Content -LiteralPath $archivo | Write-Host

      - name: Compilar y firmar el programa y el instalador
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # El propio proyecto lee de aquí las opciones de firma (`--firmar`).
          $signtool = Join-Path $env:GITHUB_WORKSPACE 'tools\bin\signtool\signtool.exe'
          $env:PCTOOLKIT_SIGN_ARGS = @(
            "--signtool $signtool",
            "--dlib $env:ARTIFACT_SIGNING_DLIB",
            "--metadatos $env:ARTIFACT_SIGNING_METADATA",
            '--sello http://timestamp.acs.microsoft.com'
          ) -join ' '
          Write-Host "Firma: $env:PCTOOLKIT_SIGN_ARGS"

          # 1. Programa en un solo archivo (se verifica ejecutándolo) y firmado.
          python build_exe.py --onefile --firmar
          if ($LASTEXITCODE -ne 0) { throw "Falló la compilación o la firma de 'PC Toolkit.exe' (código $LASTEXITCODE)" }

          # 2. Aplicación completa, desinstalador e instalador; también firmados.
          python build_installer.py --rebuild --firmar
          if ($LASTEXITCODE -ne 0) { throw "Falló la compilación o la firma del instalador (código $LASTEXITCODE)" }

      - name: Comprobar que todo quedó firmado
        run: python firmar.py --comprobar

      - name: Guardar los ejecutables firmados
        uses: actions/upload-artifact@v4
        with:
          name: pc-toolkit-firmado
          path: |
            dist/PC Toolkit Setup.exe
            dist/PC Toolkit.exe
            dist/PC Toolkit/**
          if-no-files-found: error
          retention-days: 30
