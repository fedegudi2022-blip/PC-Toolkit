name: Compilar y firmar (Windows)

# Compila el programa y el instalador en un servidor de Windows y los firma con
# Azure Artifact Signing (antes Trusted Signing) mediante una identidad federada
# OIDC: no hay ningún certificado, contraseña ni clave guardados en el repositorio.
#
# Hay que preparar una sola vez (paso a paso en DOCUMENTACION.md, apartado 8.10):
#   1. Una cuenta de Artifact Signing y un perfil de certificado en Azure.
#   2. Una aplicación en Entra ID con credencial federada para este repositorio
#      (sujeto `repo:PROPIETARIO/REPO:ref:refs/heads/main`, audiencia
#      `api://AzureADTokenExchange`) y el rol «Artifact Signing Certificate Profile Signer».
#   3. Estos secretos del repositorio: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID.
#   4. Estas variables: ARTIFACT_SIGNING_ENDPOINT (por ejemplo
#      https://weu.codesigning.azure.net), ARTIFACT_SIGNING_ACCOUNT y
#      ARTIFACT_SIGNING_PROFILE.
#
# Se ejecuta a mano (Actions → Run workflow) y al publicar una etiqueta `v…`.
# Para que corra también en cada envío a `main`, añade `branches: [main]` al `push`.

on:
  workflow_dispatch:
    inputs:
      # Publicar sin firmar es una decisión explícita: si falta la configuración de Azure,
      # el flujo se para en «Comprobar la configuración de firma» en vez de publicar en
      # silencio un release sin firma. Con esto puesto, el flujo compila y publica igual,
      # sin signtool, sin Azure y sin los pasos de firma.
      sin_firma:
        description: "Publicar sin firmar (no usa Azure)"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: write # adjuntar los ejecutables al release de la etiqueta
  id-token: write # permite pedir el token OIDC de Azure
  attestations: write # firma la procedencia de los ejecutables (build provenance)

env:
  # Versiones fijadas: cuando Microsoft publique otras, se cambian aquí.
  SDK_BUILDTOOLS_VERSION: 10.0.26100.4188
  SIGNING_CLIENT_VERSION: 1.0.146
  # No se fuerza `QT_QPA_PLATFORM=offscreen`: la plataforma "offscreen" de Qt mide el
  # texto con otras métricas de fuente y la interfaz da desbordes que no existen en un
  # escritorio real (era la causa de 15 de los fallos de la suite en el servidor). Los
  # servidores de Windows de GitHub tienen sesión de escritorio y pueden dibujar ventanas.

jobs:
  compilar-y-firmar:
    name: Compilar, firmar y publicar
    runs-on: windows-2025
    timeout-minutes: 60

    steps:
      # Todo va fijado por el SHA del commit, no por la etiqueta: una etiqueta se puede
      # mover a otro commit y el flujo ejecutaría código que nadie revisó. El comentario
      # dice a qué versión corresponde, que es lo que hay que mirar para actualizar.
      - name: Descargar el código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # La configuración de Azure se comprueba antes que nada. Si falta, `azure/login`
      # fallaba con «Not all values are present. Ensure 'client-id' and 'tenant-id' are
      # supplied.», que no dice ni qué falta ni qué hacer, y encima después de descargar
      # signtool y las herramientas de firma. Con esto el trabajo se para en segundos y
      # el mensaje lleva a DOCUMENTACION.md, apartado 8.10.
      - name: Comprobar la configuración de firma
        if: ${{ !inputs.sin_firma }}
        shell: pwsh
        env:
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          CUENTA: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          PERFIL: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
        run: |
          $ErrorActionPreference = 'Stop'
          $faltan = @()
          foreach ($par in @(
            @('secreto AZURE_CLIENT_ID', $env:CLIENT_ID),
            @('secreto AZURE_TENANT_ID', $env:TENANT_ID),
            @('secreto AZURE_SUBSCRIPTION_ID', $env:SUBSCRIPTION_ID),
            @('variable ARTIFACT_SIGNING_ENDPOINT', $env:ENDPOINT),
            @('variable ARTIFACT_SIGNING_ACCOUNT', $env:CUENTA),
            @('variable ARTIFACT_SIGNING_PROFILE', $env:PERFIL)
          )) {
            if (-not $par[1]) { $faltan += $par[0] }
          }
          if ($faltan.Count -gt 0) {
            Write-Host 'Falta la configuración de firma con Azure (Settings -> Secrets and variables -> Actions):'
            $faltan | ForEach-Object { Write-Host "  - $_" }
            Write-Host 'Se prepara una sola vez y está explicado paso a paso en DOCUMENTACION.md, apartado 8.10.'
            Write-Host 'Sin ella no se compila ni se publica nada: la compilación va después del inicio de sesión.'
            throw "Falta la configuración de firma con Azure ($($faltan -join ', '))."
          }
          Write-Host 'Configuración de firma presente.'

      - name: Preparar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      # La biblioteca de firma en la nube necesita el entorno de ejecución de .NET 8.
      - name: Preparar .NET
        if: ${{ !inputs.sin_firma }}
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"

      - name: Instalar las dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Descargar signtool (paquete oficial de Microsoft)
        if: ${{ !inputs.sin_firma }}
        run: python firmar.py --traer-signtool --signtool-version $env:SDK_BUILDTOOLS_VERSION
        shell: pwsh

      - name: Descargar las herramientas de firma de Azure
        if: ${{ !inputs.sin_firma }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $destino = Join-Path $env:GITHUB_WORKSPACE 'tools\bin\artifact-signing'
          New-Item -ItemType Directory -Force -Path $destino | Out-Null

          $paquete = 'microsoft.artifactsigning.client'
          $url = "https://api.nuget.org/v3-flatcontainer/$paquete/$env:SIGNING_CLIENT_VERSION/$paquete.$env:SIGNING_CLIENT_VERSION.nupkg"
          $descarga = Join-Path $env:RUNNER_TEMP 'artifact-signing-client.nupkg'
          Invoke-WebRequest -Uri $url -OutFile $descarga
          Expand-Archive -LiteralPath $descarga -DestinationPath $destino -Force

          $dlib = Join-Path $destino 'bin\x64\Azure.CodeSigning.Dlib.dll'
          if (-not (Test-Path $dlib)) {
            throw "El paquete $paquete no trae bin\x64\Azure.CodeSigning.Dlib.dll"
          }
          "ARTIFACT_SIGNING_DLIB=$dlib" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Biblioteca de firma lista: $dlib"

      - name: Iniciar sesión en Azure con identidad federada (OIDC)
        if: ${{ !inputs.sin_firma }}
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Preparar el archivo de metadatos de la firma
        if: ${{ !inputs.sin_firma }}
        shell: pwsh
        env:
          ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          CUENTA: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          PERFIL: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($nombre in 'ENDPOINT', 'CUENTA', 'PERFIL') {
            if (-not [Environment]::GetEnvironmentVariable($nombre)) {
              throw "Falta la variable $nombre (Settings → Secrets and variables → Actions → Variables)"
            }
          }

          $metadatos = [ordered]@{
            Endpoint               = $env:ENDPOINT
            CodeSigningAccountName = $env:CUENTA
            CertificateProfileName = $env:PERFIL
            # `azure/login` deja la sesión iniciada en Azure CLI; se conserva esa
            # credencial y se descartan las que no existen en un servidor de compilación.
            ExcludeCredentials     = @(
              'EnvironmentCredential'
              'ManagedIdentityCredential'
              'WorkloadIdentityCredential'
              'SharedTokenCacheCredential'
              'VisualStudioCredential'
              'VisualStudioCodeCredential'
              'AzurePowerShellCredential'
              'AzureDeveloperCliCredential'
              'InteractiveBrowserCredential'
            )
          }

          # Se escribe en UTF-8 sin BOM con el API de .NET: vale igual en PowerShell 7 y
          # en el 5.1, y el archivo no lleva la marca que rompería el lector de metadatos.
          $archivo = Join-Path $env:RUNNER_TEMP 'artifact-signing-metadata.json'
          $json = $metadatos | ConvertTo-Json -Depth 5
          [System.IO.File]::WriteAllText($archivo, $json, (New-Object System.Text.UTF8Encoding($false)))
          "ARTIFACT_SIGNING_METADATA=$archivo" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-Content -LiteralPath $archivo | Write-Host

      - name: Compilar y firmar el programa y el instalador
        if: ${{ !inputs.sin_firma }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # El propio proyecto lee de aquí las opciones de firma (`--firmar`).
          $signtool = Join-Path $env:GITHUB_WORKSPACE 'tools\bin\signtool\signtool.exe'
          $env:PCTOOLKIT_SIGN_ARGS = @(
            "--signtool $signtool",
            "--dlib $env:ARTIFACT_SIGNING_DLIB",
            "--metadatos $env:ARTIFACT_SIGNING_METADATA",
            '--sello http://timestamp.acs.microsoft.com'
          ) -join ' '
          Write-Host "Firma: $env:PCTOOLKIT_SIGN_ARGS"

          # 1. Programa en un solo archivo (se verifica ejecutándolo) y firmado.
          python build_exe.py --onefile --firmar
          if ($LASTEXITCODE -ne 0) { throw "Falló la compilación o la firma de 'PC Toolkit.exe' (código $LASTEXITCODE)" }

          # 2. Aplicación completa, desinstalador e instalador; también firmados.
          python build_installer.py --rebuild --firmar
          if ($LASTEXITCODE -ne 0) { throw "Falló la compilación o la firma del instalador (código $LASTEXITCODE)" }

      # El mismo trabajo, sin firma (cuando no hay configuración de Azure y se publica a
      # propósito sin firmar). Se compila, se pasan las mismas comprobaciones y se publica
      # lo mismo: lo único que desaparece son signtool, Azure y `--firmar`.
      - name: Compilar el programa y el instalador (sin firma)
        if: ${{ inputs.sin_firma }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          python build_exe.py --onefile
          if ($LASTEXITCODE -ne 0) { throw "Falló la compilación de 'PC Toolkit.exe' (código $LASTEXITCODE)" }

          python build_installer.py --rebuild
          if ($LASTEXITCODE -ne 0) { throw "Falló la compilación del instalador (código $LASTEXITCODE)" }

      # La suite va después de compilar, no antes: así comprueba los ejecutables de
      # `dist\` que se acaban de generar (los cuatro artefactos, los accesos directos
      # del paquete, las firmas) en vez de un árbol recién clonado donde no hay ninguno.
      # Si algo falla aquí, el trabajo se para y no se publica ningún artefacto, así que
      # la firma ya hecha no llega a salir del servidor.
      - name: Comprobaciones automáticas
        run: python tests/smoke_test.py

      - name: Comprobar que todo quedó firmado
        if: ${{ !inputs.sin_firma }}
        run: python firmar.py --comprobar

      # La suite comprueba la *ruta de código* del desinstalador —incluido el caso que
      # costó la publicación de la 1.2.0: sin PySide6, en un proceso aparte—, pero no
      # ejecuta el desinstalador que sale en `dist\`. Este paso sí: instala el paquete
      # compilado con las rutas reales del usuario, ejecuta la copia instalada y
      # desinstala con el desinstalador compilado, exigiendo que no quede rastro
      # (accesos directos, registro, arranque automático ni carpeta de programa). Va
      # **antes** de publicar: así un desinstalador que no arranca, o que deja basura,
      # no puede volver a salir en un release. El servidor de compilación es de un solo
      # uso, así que instalarlo ahí no molesta a nadie.
      - name: Instalar y desinstalar el paquete real
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/verificar_instalacion.py
          if ($LASTEXITCODE -ne 0) {
            throw "La instalación o la desinstalación del paquete compilado ha fallado (código $LASTEXITCODE)"
          }

      - name: Guardar los ejecutables
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          # El nombre dice cómo salió la compilación, para no confundir el artefacto de una
          # publicación firmada con el de una que no lo está.
          name: ${{ inputs.sin_firma && 'pc-toolkit-sin-firma' || 'pc-toolkit-firmado' }}
          path: |
            dist/PC Toolkit Setup.exe
            dist/PC Toolkit.exe
            dist/PC Toolkit/**
          if-no-files-found: error
          retention-days: 30

      # --- Publicación, solo al empujar una etiqueta `v…` ----------------------
      # Se preparan los dos nombres con los que se reparte el programa (el instalador y el
      # portátil) y el resumen SHA-256, que es lo que se cita en las notas de la versión.
      - name: Preparar los archivos de la entrega
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = python -c "import sys; sys.path.insert(0, '.'); from pctoolkit.core.config import APP_VERSION; print(APP_VERSION)"
          $destino = Join-Path $env:GITHUB_WORKSPACE 'dist\entrega'
          New-Item -ItemType Directory -Force -Path $destino | Out-Null
          Copy-Item 'dist\PC Toolkit Setup.exe' (Join-Path $destino "PC-Toolkit-$version-Setup.exe") -Force
          Copy-Item 'dist\PC Toolkit.exe' (Join-Path $destino "PC-Toolkit-$version-portable.exe") -Force
          Push-Location $destino
          try {
            Get-ChildItem -Filter 'PC-Toolkit-*.exe' | Sort-Object Name | ForEach-Object {
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower()
              "$hash  $($_.Name)"
            } | Set-Content -LiteralPath 'SHA256SUMS.txt' -Encoding utf8
          } finally {
            Pop-Location
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-Content -LiteralPath (Join-Path $destino 'SHA256SUMS.txt')

      # La procedencia la firma GitHub con la identidad del flujo (transparencia de
      # suministro): quien descarga puede comprobar que el archivo salió de este
      # repositorio y de este commit, sin depender de nuestra palabra.
      - name: Firmar la procedencia de los ejecutables
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/entrega/PC-Toolkit-*-Setup.exe
            dist/entrega/PC-Toolkit-*-portable.exe

      - name: Adjuntar los ejecutables al release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $etiqueta = "${{ github.ref_name }}"

          # Las notas del release llevan dentro los SHA-256 que se acaban de calcular, y
          # dicen si los ejecutables van firmados o no. Se escriben en un archivo desde
          # PowerShell: así no hay comillas ni saltos de línea que escapar en la llamada.
          $entrega = Join-Path $env:GITHUB_WORKSPACE 'dist\entrega'
          $lineas = @(
            "PC Toolkit $env:VERSION",
            '',
            '## Comprobar la descarga',
            '',
            'Los SHA-256 de los archivos adjuntos:',
            '',
            '```'
          )
          $lineas += Get-Content -LiteralPath (Join-Path $entrega 'SHA256SUMS.txt')
          $lineas += @('```', '')
          if ('${{ inputs.sin_firma }}' -eq 'true') {
            $lineas += 'Estos ejecutables van **sin firmar**: si Windows avisa con «Windows protegió tu PC», se continúa con «Más información» y «Ejecutar de todos modos».'
          } else {
            $lineas += 'Los ejecutables van firmados digitalmente (Azure Artifact Signing), con sello de tiempo.'
          }
          $notas = Join-Path $env:RUNNER_TEMP 'notas-release.md'
          $lineas | Set-Content -LiteralPath $notas -Encoding utf8

          gh release view $etiqueta --json tagName *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $etiqueta --title "PC Toolkit $env:VERSION" --notes-file $notas
          } else {
            gh release edit $etiqueta --notes-file $notas
          }
          gh release upload $etiqueta `
            "dist\entrega\PC-Toolkit-$env:VERSION-Setup.exe" `
            "dist\entrega\PC-Toolkit-$env:VERSION-portable.exe" `
            "dist\entrega\SHA256SUMS.txt" `
            --clobber
          if ($LASTEXITCODE -ne 0) { throw "No se pudieron adjuntar los archivos al release $etiqueta" }
          gh release view $etiqueta
